apiVersion: v1
kind: ConfigMap
metadata:
  name: CELLS-config
  namespace: CELLS
data:
  # Network configuration
  network_port: "4001"
  bootstrap_peers: ""
  
  # Storage configuration
  storage_type: "sqlite"
  sqlite_path: "/app/data/CELLS.db"
  
  # WebSocket origin allowlist for the dashboard.
  #
  # initialiseWSAllowedOriginsFromEnv (internal/dashboard/websocket.go) returns
  # early when neither CELLS_WS_ALLOWED_ORIGINS nor CELLS_CORS_ALLOWED_ORIGINS is
  # set, leaving CheckOrigin permissive -- against that file's own stated
  # requirement. The bare-metal unit sets it (config/CELLS.service:26); no
  # container or Kubernetes asset did.
  #
  # The correct value is the origin the BROWSER sends, which depends on how you
  # expose the dashboard. The Service is ClusterIP, so the default below covers
  # `kubectl port-forward svc/CELLS-dashboard 8081:8081` only.
  #
  # CHANGE THIS if you front the dashboard with an Ingress or LoadBalancer --
  # set it to that hostname (e.g. "https://CELLS.example.com"). Leaving the
  # port-forward default in place behind an Ingress will REJECT the websocket
  # upgrade, which surfaces as a dashboard that loads but never receives live
  # metrics.
  ws_allowed_origins: "http://127.0.0.1:8081,http://localhost:8081"

  # Monitoring configuration
  dashboard_port: "8081"
  log_viewer_port: "9000"
  log_file: "/app/logs/CELLS.log"
  log_level: "INFO"
  
  # API configuration
  api_port: "8080"
  enable_tls: "false"
  # Per-client sliding window (env API_RATE_LIMIT_* / CELLS_API_RATE_LIMIT_*)
  api_rate_limit_max: "100"
  api_rate_limit_window: "1m"
  
  # Performance configuration
  transaction_interval: "1s"
  health_check_interval: "30s"

