# /etc/systemd/system/CELLS.service.d/cors.conf
#
# CORS allowlist for the public API surface.
#
# Browser-origin enforcement is done by pkg/api/CORSMiddleware (see
# CELLS/source/pkg/api/cors.go). The middleware is deny-by-default:
# an empty allowlist means EVERY browser request to the API returns
# 403 with no `Access-Control-Allow-Origin` header — which is what
# the user sees as
#
#   Access to fetch at 'https://api.CELLS.tech/...' from origin
#   'https://CELLS.tech' has been blocked by CORS policy
#
# in the browser console. Without this drop-in, the static-site
# wallet (CELLS.tech/wallet.html), the operator dashboard
# (dashboard.CELLS.tech) and any other browser-only consumer of the
# API will fail with that exact error.
#
# Install:
#
#   sudo install -m 0644 cors.conf \
#     /etc/systemd/system/CELLS.service.d/cors.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart CELLS.service
#
# Verify (from the same host or from outside):
#
#   curl -sSI -X OPTIONS \
#     -H 'Origin: https://CELLS.tech' \
#     -H 'Access-Control-Request-Method: GET' \
#     https://api.CELLS.tech/api/v1/wallet/balance?address=DEADBEEF \
#     | grep -i '^access-control-\|^vary:'
#
# Expect:
#
#   access-control-allow-origin: https://CELLS.tech
#   access-control-allow-methods: GET, POST, PUT, DELETE, PATCH, OPTIONS
#   access-control-allow-headers: Authorization, Content-Type, X-CSRF-Token, X-Timestamp, X-Nonce, X-Signature
#   access-control-max-age: 600
#   vary: Origin
#
# Bearer-token auth means the wallet does NOT need credentialed
# CORS, so we deliberately leave AllowCredentials at its `false`
# default and do NOT use the `*` wildcard (which would be ignored
# anyway under credentialed mode per the Fetch spec).
#
# Operators who add a new browser-facing surface MUST extend the
# list below and `systemctl restart CELLS.service`. Disallowed
# origins continue to 403 (test surface:
# `pkg/api/cors_test.go::TestCORS_DenyDisallowedOrigin`).
#
# The exception needs no entry here: GET and HEAD of the public read-only
# endpoints (status, health, versions, wallet balance and nonce, receipts,
# chain blocks and parents, mining blocks and emission; `publicReadPaths`
# in pkg/api/cors.go) answer any origin with `Access-Control-Allow-Origin: *`
# and never with credentials, so browser wallets, the CELLS Wallet extension
# and explorers can read them.

[Service]
Environment="CELLS_CORS_ALLOWED_ORIGINS=https://CELLS.tech,https://www.CELLS.tech,https://dashboard.CELLS.tech"
